# 検査、テスト、ビルド、E2E。
#
# Linuxでは、手元と同じNixの開発環境で動かす。WindowsではNixが動かないので、
# .node-versionの版のNode.jsと、packageManagerの版のpnpmを直接入れる。
# Linuxのcheck-envが、Nixの版とこの2つが一致することを確かめている。
#
# Actionsはタグではなくコミットのハッシュで固定する。更新はDependabotが行う。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 変更した行のミューテーションテストが、比べる相手のブランチを使う。
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Install
        run: |
          pnpm check-env
          pnpm install --frozen-lockfile
      # 手元のpnpm checkと同じ検査を、どこで落ちたかが分かるように1つずつ動かす。
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Size budget
        run: pnpm budget
      - name: Check the .vsix contents
        run: pnpm check:vsix
      # ミューテーションテストは指標で、検出漏れがあっても失敗にしない。
      # PRでは、変更した行の検出漏れ（どのテストも届かないものを含む）を差分に警告として出す。
      - name: Mutation tests (changed lines)
        if: github.event_name == 'pull_request'
        run: pnpm exec mutator --since "origin/${GITHUB_BASE_REF}"
      # mutatorの設定と等価ミュータントの記録を書き換えると、失敗させずに検査の範囲を狭められるので、PRで変わったら警告する。
      - name: Mutation settings changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- 'mutator.config.*' mutator.accepted.json |
            while read -r file; do
              echo "::warning file=${file},title=ミューテーションテストの設定が変わった::${file}が変わりました。検査する範囲が狭まっていないか、動作の変わる壊し方を記録していないかを確かめてください。"
            done
      # 全件で全体のスコアを出し、ジョブの概要に書く。テストを弱めたり消したりしただけの変更は、
      # ここでスコアが下がる。警告は上のステップに任せるので、GITHUB_ACTIONSを空にして出さない。
      - name: Mutation tests (all)
        run: |
          GITHUB_ACTIONS='' pnpm mutation | tee "$RUNNER_TEMP/mutation.txt"
          {
            echo "### ミューテーションテスト（全件）"
            echo '```text'
            grep -E '^(mutants|Killed|score)' "$RUNNER_TEMP/mutation.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: nix develop .#e2e --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: E2E with the minimum supported VSCodium
        run: xvfb-run -a pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-linux
          path: test-results/
          if-no-files-found: ignore

  windows:
    name: check (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # 手元のpnpm checkと同じ検査を、どこで落ちたかが分かるように1つずつ動かす。
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Size budget
        run: pnpm budget
      - name: Check the .vsix contents
        run: pnpm check:vsix
      - name: E2E with the latest stable VS Code
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-windows
          path: test-results/
          if-no-files-found: ignore

  nix:
    name: nix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: shellcheck and actionlint
        run: nix develop --command sh -c 'shellcheck scripts/*.sh && actionlint'
