# 検査、テスト、ビルド、E2E。
#
# Linuxでは、手元と同じNixの開発環境で動かす。WindowsではNixが動かないので、
# .node-versionの版のNode.jsと、packageManagerの版のpnpmを直接入れる。
# Linuxのcheck-envが、Nixの版とこの2つが一致することを確かめている。
#
# Actionsはタグではなくコミットのハッシュで固定する。更新はDependabotが行う。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 変更した行のミューテーションテストが、比べる相手のブランチを使う。
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Install
        run: |
          pnpm check-env
          pnpm install --frozen-lockfile
      # 手元のpnpm checkと同じ検査を、どこで落ちたかが分かるように1つずつ動かす。
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Size budget
        run: pnpm budget
      - name: Check the .vsix contents
        run: pnpm check:vsix
      # ミューテーションテストの結果は指標で、検出できなかったミュータントがあっても失敗にしない。
      # 失敗にするのは、テストを弱めた変更（変わっていないコードについて、前は検出できたミュータントを
      # 今は検出できない）だけ。比べる前回の結果は、mainへのpushで保存したキャッシュから復元する。
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .mutator
          key: mutator-${{ github.sha }}
          restore-keys: mutator-
      # PRでは、変更した行と、変更したテストが確かめるコードのミュータントを実行する。変更した行の検出漏れ
      # （どのテストも届かないものを含む）は、mutatorが差分に警告として出す。続けて結果を判定し、
      # テストを弱めた変更があれば失敗させる。何も検出しない新しいテストと、mutatorの設定の変更は警告にする。
      - name: Mutation tests (changed lines)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec mutator --since "origin/${GITHUB_BASE_REF}" --include-test-changes --kill-matrix --reporter text --reporter json
          pnpm mutation:findings "origin/${GITHUB_BASE_REF}"
      # 全件で全体のスコアを出し、ジョブの概要に書く。警告は上のステップに任せるので、GITHUB_ACTIONSを空にして出さない。
      - name: Mutation tests (all)
        run: |
          GITHUB_ACTIONS='' pnpm mutation | tee "$RUNNER_TEMP/mutation.txt"
          {
            echo "### ミューテーションテスト（全件）"
            echo '```text'
            grep -E '^(mutants|Killed|score)' "$RUNNER_TEMP/mutation.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # mainの全件の結果を、PRが比べる基準として保存する。
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name == 'push'
        with:
          path: .mutator
          key: mutator-${{ github.sha }}

  e2e:
    name: e2e (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: nix develop .#e2e --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: E2E with the minimum supported VSCodium
        run: xvfb-run -a pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-linux
          path: test-results/
          if-no-files-found: ignore

  windows:
    name: check (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # 手元のpnpm checkと同じ検査を、どこで落ちたかが分かるように1つずつ動かす。
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Size budget
        run: pnpm budget
      - name: Check the .vsix contents
        run: pnpm check:vsix
      - name: E2E with the latest stable VS Code
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-windows
          path: test-results/
          if-no-files-found: ignore

  nix:
    name: nix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: shellcheck and actionlint
        run: nix develop --command sh -c 'shellcheck scripts/*.sh && actionlint'
